<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultimate Tic-Tac-Toe</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <h1>Ultimate Tic-Tac-Toe</h1>

  <div id="controls">
    <label>
      Mode:
      <select id="mode-select">
        <option value="human-ai">Human vs AI</option>
        <option value="human-human">Human vs Human</option>
      </select>
    </label>
    <label>
      AI Difficulty:
      <select id="difficulty-select">
        <option value="300">Easy (300)</option>
        <option value="1000" selected>Medium (1000)</option>
        <option value="3000">Hard (3000)</option>
      </select>
    </label>
    <button id="new-game-btn">New Game</button>
  </div>

  <div id="status"></div>

  <div id="large-board">
    <!-- 9 small boards, generated by JS -->
  </div>

  <script src="/static/game.js"></script>
</body>
</html>
