<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia Chain Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="title">Wikipedia Chain Finder</h1>
            <p class="subtitle">Find the shortest path between any two Wikipedia articles</p>
        </header>

        <!-- Input Section -->
        <main class="main">
            <form id="search-form" class="search-form" aria-label="Search for Wikipedia path">
                <div class="input-group">
                    <label for="start-article" class="input-label">Start Article</label>
                    <input
                        type="text"
                        id="start-article"
                        name="start"
                        class="input-field"
                        placeholder="e.g., Python (programming language)"
                        autocomplete="off"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="end-article" class="input-label">End Article</label>
                    <input
                        type="text"
                        id="end-article"
                        name="end"
                        class="input-field"
                        placeholder="e.g., Computer science"
                        autocomplete="off"
                        required
                    >
                </div>

                <button type="submit" id="submit-btn" class="submit-btn">
                    <span class="btn-text">Find Path</span>
                    <span class="btn-loading" aria-hidden="true">
                        <span class="spinner"></span>
                        Searching...
                    </span>
                </button>
            </form>

            <!-- Error Messages -->
            <div id="error-container" class="error-container" role="alert" aria-live="polite" hidden>
                <p id="error-message" class="error-message"></p>
            </div>

            <!-- Results Section -->
            <section id="results-container" class="results-container" aria-label="Search results" hidden>
                <h2 class="results-title">Path Found</h2>
                <div id="results-stats" class="results-stats"></div>
                <div id="results-path" class="results-path"></div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Uses the <a href="https://www.mediawiki.org/wiki/API:Main_page" target="_blank" rel="noopener noreferrer">Wikipedia API</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
